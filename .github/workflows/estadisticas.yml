# Construye la imagen del micro de estadísticas y la sube a ECR.
#
# Se dispara al publicar una etiqueta de git "estadisticas-vN":
#   git tag estadisticas-v2 && git push origin estadisticas-v2   →   ECR estadisticas:v2
#
# Credenciales: un usuario de IAM "github-ecr" que solo puede subir a este repositorio de ECR,
# con sus claves guardadas como secretos de GitHub. Lo ideal sería OIDC (sin claves), pero el
# plan gratuito de AWS bloquea crear el proveedor de identidad de GitHub.
name: Imagen de estadísticas

on:
  push:
    tags: ['estadisticas-v*']

permissions:
  contents: read

jobs:
  imagen:
    runs-on: ubuntu-latest
    env:
      REPO: estadisticas
    steps:
      - uses: actions/checkout@v4

      - name: Credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Login en ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construir y subir
        working-directory: services/estadisticas
        run: |
          VERSION="${GITHUB_REF_NAME#estadisticas-}"
          IMAGEN="${{ steps.ecr.outputs.registry }}/$REPO:$VERSION"
          # --provenance=false: una sola imagen, sin el índice con la atestación aparte
          docker build --provenance=false -t "$IMAGEN" .
          docker push "$IMAGEN"
          echo "Subida $IMAGEN" >> "$GITHUB_STEP_SUMMARY"
