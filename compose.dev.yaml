# Levanta la web en modo desarrollo dentro de un contenedor:
#   docker compose -f compose.dev.yaml up -d      → http://localhost:4321
#   docker compose -f compose.dev.yaml logs -f    → ver lo que imprime
#   docker compose -f compose.dev.yaml down       → apagarla
services:
  web:
    image: node:24-slim
    working_dir: /app
    command: sh -c "npm ci && npx astro dev --host 0.0.0.0 --port 4321"
    ports:
      # Solo desde esta máquina (127.0.0.1), no desde el resto de la red
      - "127.0.0.1:4321:4321"
    volumes:
      # El código se comparte con Windows: si edito un archivo, la web se actualiza
      - .:/app
      # node_modules va aparte: las dependencias de Linux no sirven en Windows y viceversa
      - node_modules:/app/node_modules
    environment:
      # En carpetas compartidas desde Windows los cambios no siempre se detectan: revisar cada tanto
      - CHOKIDAR_USEPOLLING=true

volumes:
  node_modules:
